name: Cadastro com Playwright
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest --junitxml=evidencias/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-cadastro
          path: evidencias/
          retention-days: 14
